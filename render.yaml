services:
  - type: web
    name: Beta
    runtime: docker
    plan: free
    envVars:
      - key: RENDER_API_KEY
        value: rnd_HzODDgruSZ1SPdWpJHwLsJgLiqjB
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_PROVIDER
        value: groq
      - key: DATABASE_URL
        fromDatabase:
          name: browser-automation-db
          property: connectionString
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: BETA_API_KEY
        generateValue: true
      - key: VIRTUAL_MODEL_NAME
        value: beta-virtual-ai
      - key: MAX_AI_WORKFLOWS
        value: "1"
      - key: MAX_DELIBERATION_ROUNDS
        value: "2"
      - key: BROWSER_ENGINE
        value: selenium
      - key: GROQ_AGENT_1_API_KEY
        sync: false
      - key: GROQ_AGENT_1_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_AGENT_1_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_AGENT_2_API_KEY
        sync: false
      - key: GROQ_AGENT_2_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_AGENT_2_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_AGENT_3_API_KEY
        sync: false
      - key: GROQ_AGENT_3_MODEL
        value: allam-2-7b
      - key: GROQ_AGENT_3_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_AGENT_4_API_KEY
        sync: false
      - key: GROQ_AGENT_4_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_AGENT_4_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_AGENT_5_API_KEY
        sync: false
      - key: GROQ_AGENT_5_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_AGENT_5_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ALLOWED_DOMAINS
        value: ""
      - key: TASK_TIMEOUT
        value: 300
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: PREVIEW_ENABLED
        value: "true"
      - key: PREVIEW_TOKEN_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"

databases:
  - name: Beta-db
    plan: free
    databaseName: beta
