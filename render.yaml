services:
  - type: web
    name: browser-automation
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: ALLOWED_DOMAINS
        value: ""
      - key: BROWSER_SESSION_TIMEOUT
        value: 600
      - key: TASK_TIMEOUT
        value: 300
      - key: HEADLESS
        value: "true"
      - key: PREVIEW_ENABLED
        value: "true"
      - key: PREVIEW_TOKEN_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DEBUG
        value: "false"
