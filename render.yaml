services:
  - type: web
    name: browser-automation
    runtime: docker
    plan: starter
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_PROVIDER
        value: groq
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./browser_automation.db
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: ALLOWED_DOMAINS
        value: ""
      - key: BROWSER_SESSION_TIMEOUT
        value: 600
      - key: TASK_TIMEOUT
        value: 300
      - key: HEADLESS
        value: "true"
      - key: PREVIEW_ENABLED
        value: "true"
      - key: PREVIEW_TOKEN_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DEBUG
        value: "false"
      - key: PROXY_ENABLED
        value: "true"
      - key: PROXY_APIKEY
        value: "01a03626-786e-79a1-9d39-8d77a7fcf978"
      - key: PROXY_SECRET
        value: "01a03626-786e-79a1-9d39-8d77a8bb0953"
      - key: PROXY_URL
        value: "http://01a03626-786e-79a1-9d39-8d77a7fcf978:01a03626-786e-79a1-9d39-8d77a8bb0953@proxy-us.proxy-cheap.com:5959"
