services:
  - type: web
    name: Beta
    runtime: docker
    plan: free
    envVars:
      - key: RENDER_API_KEY
        value: rnd_nglusem4WZofG64JH9imWTGiJEjL
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_PROVIDER
        value: groq
      - key: DATABASE_URL
        fromDatabase:
          name: browser-automation-db
          property: connectionString
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: BETA_API_KEY
        generateValue: true
      - key: VIRTUAL_MODEL_NAME
        value: beta-virtual-ai
      - key: MAX_AI_WORKFLOWS
        value: "1"
      - key: MAX_DELIBERATION_ROUNDS
        value: "2"
      - key: BROWSER_ENGINE
        value: selenium
      - key: GROQ_AGENT_1_API_KEY
        sync: false
      - key: GROQ_AGENT_1_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_AGENT_1_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_AGENT_2_API_KEY
        sync: false
      - key: GROQ_AGENT_2_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_AGENT_2_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_AGENT_3_API_KEY
        sync: false
      - key: GROQ_AGENT_3_MODEL
        value: allam-2-7b
      - key: GROQ_AGENT_3_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_AGENT_4_API_KEY
        sync: false
      - key: GROQ_AGENT_4_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_AGENT_4_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_AGENT_5_API_KEY
        sync: false
      - key: GROQ_AGENT_5_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_AGENT_5_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ALLOWED_DOMAINS
        value: ""
      - key: TASK_TIMEOUT
        value: 300
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: PROXY_ENABLED
        value: "true"
      - key: PROXY_FILE
        value: "proxy.txt"
      - key: PREVIEW_ENABLED
        value: "true"
      - key: PREVIEW_TOKEN_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LANGUAGE
        value: "pl"
      - key: BACKEND_URL
        value: "http://localhost:8000"
      - key: LOCAL_UI_HOST
        value: "0.0.0.0"
      - key: LOCAL_UI_PORT
        value: "23400"
      - key: BROWSER_HEADLESS
        value: "true"
      - key: NGROK_AUTH_TOKEN
        sync: false
      - key: LOCAL_AI_URL
        value: "http://beta-localai:8100"
      - key: REDEPLOY
        value: "2026-09-06"

  - type: web
    name: beta-localai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.local-ai
    envVars:
      - key: LOCAL_AI_ENABLED
        value: "true"
      - key: LOCAL_AI_MODEL
        value: "/app/models/phi-3-mini-4k-instruct-q4_k_m.gguf"
      - key: LOCAL_AI_CONTEXT
        value: "4096"
      - key: LOCAL_AI_MAX_TOKENS
        value: "512"
      - key: LOCAL_AI_THREADS
        value: "4"
      - key: LOCAL_AI_PORT
        value: "8100"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

databases:
  - name: Beta-db
    plan: free
    databaseName: beta
