services:
  - type: web
    name: browser-automation
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_PROVIDER
        value: groq
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./browser_automation.db
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: ALLOWED_DOMAINS
        value: ""
      - key: BROWSER_SESSION_TIMEOUT
        value: 600
      - key: TASK_TIMEOUT
        value: 300
      - key: HEADLESS
        value: "true"
      - key: PREVIEW_ENABLED
        value: "true"
      - key: PREVIEW_TOKEN_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DEBUG
        value: "false"
