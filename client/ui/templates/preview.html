<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beta - Live Preview</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:#0a0a0f;color:#f0f0f5;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
        .bar{background:#111118;border-bottom:1px solid #2a2a3a;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:40px}
        .bar h1{font-size:12px;font-weight:600;color:#9090a8;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px}
        .bar h1 .live{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .info{display:flex;gap:12px;align-items:center;font-size:11px;color:#9090a8}
        .live-area{flex:1;display:flex;align-items:center;justify-content:center;background:#000;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
        .live-area img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto;border:1px solid #2a2a3a}
        .badge{position:absolute;top:10px;left:10px;background:#f87171;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;display:none;letter-spacing:.5px;z-index:2}
        .badge.on{display:block}
        .fps-display{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);color:#34d399;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;font-family:monospace;z-index:2}
        .placeholder{color:#606078;font-size:13px;text-align:center;padding:20px}
        .ctrls{background:#111118;border-top:1px solid #2a2a3a;padding:6px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0;min-height:44px;flex-wrap:wrap}
        .ctrls label{font-size:11px;color:#9090a8;white-space:nowrap}
        .ctrls input{background:#1a1a24;border:1px solid #2a2a3a;border-radius:6px;color:#f0f0f5;padding:6px 8px;font-size:12px;flex:1;min-width:0}
        .ctrls input:focus{outline:none;border-color:#7c5cfc}
        .ctrls select{background:#1a1a24;border:1px solid #2a2a3a;border-radius:6px;color:#f0f0f5;padding:6px 8px;font-size:12px}
        .ctrls button{padding:6px 14px;border-radius:6px;border:1px solid #2a2a3a;background:#1a1a24;color:#f0f0f5;cursor:pointer;font-size:12px;transition:all .12s;white-space:nowrap}
        .ctrls button:hover{background:#22222e;border-color:#35354a}
        .ctrls button.active{background:#7c5cfc;border-color:#7c5cfc;color:#fff}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:2px}
        @media(max-width:600px){
            .bar{padding:6px 10px;height:36px}
            .bar h1{font-size:11px;letter-spacing:.5px}
            .info{gap:8px}
            .ctrls{padding:8px;gap:6px}
            .ctrls input{font-size:14px;padding:8px}
            .ctrls select{font-size:14px;padding:8px}
            .ctrls button{padding:8px 16px;font-size:13px}
            .live-area img{border:none;border-radius:0}
        }
    </style>
</head>
<body>
<div class="bar">
    <h1><span class="live"></span> LIVE PREVIEW</h1>
    <div class="info">
        <span id="res">1024x768</span>
        <span id="fps-info">15 FPS</span>
    </div>
</div>
<div class="live-area" id="live">
    <div class="placeholder" id="ph">Enter a URL below and click Start to begin live preview</div>
    <div class="badge" id="badge">LIVE</div>
    <div class="fps-display" id="fps"></div>
</div>
<div class="ctrls">
    <input type="text" id="url-input" value="https://example.com" placeholder="https://...">
    <select id="fps-sel" onchange="updateFps(this.value)">
        <option value="5">5 FPS</option>
        <option value="10">10 FPS</option>
        <option value="15" selected>15 FPS</option>
        <option value="20">20 FPS</option>
    </select>
    <button id="btn-start" onclick="startStream()">Start</button>
    <button onclick="stopStream()">Stop</button>
</div>

<script>
let imgEl=null, fps=15, frameCount=0, lastFpsTime=Date.now(), streaming=false;

function startStream(){
    stopStream();
    const url=document.getElementById('url-input').value.trim();
    if(!url)return;
    streaming=true;
    const live=document.getElementById('live');
    const ph=document.getElementById('ph');
    if(imgEl){imgEl.remove();imgEl=null}
    imgEl=document.createElement('img');
    imgEl.onload=function(){
        ph.style.display='none';
        document.getElementById('badge').className='badge on';
        document.getElementById('btn-start').className='active';
        trackFps();
    };
    imgEl.onerror=function(){
        document.getElementById('badge').className='badge';
    };
    imgEl.src='/api/preview/stream?url='+encodeURIComponent(url)+'&fps='+fps;
    live.appendChild(imgEl);
}

function stopStream(){
    streaming=false;
    if(imgEl){imgEl.src='';imgEl.remove();imgEl=null}
    document.getElementById('badge').className='badge';
    document.getElementById('fps').textContent='';
    document.getElementById('btn-start').className='';
    document.getElementById('ph').style.display='block';
}

function trackFps(){
    frameCount=0;lastFpsTime=Date.now();
    const go=()=>{if(!streaming||!imgEl)return;frameCount++;const n=Date.now();if(n-lastFpsTime>=1000){document.getElementById('fps').textContent=frameCount+' fps';frameCount=0;lastFpsTime=n}requestAnimationFrame(go)};
    requestAnimationFrame(go);
}

function updateFps(v){fps=parseInt(v);document.getElementById('fps-info').textContent=v+' FPS';if(streaming)startStream()}

document.getElementById('url-input').addEventListener('keydown',e=>{if(e.key==='Enter')startStream()});
</script>
</body>
</html>
